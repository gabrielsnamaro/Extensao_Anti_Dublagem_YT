<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiDUB</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="card">
        <header class="header">
            <img src="/icons/icon-32.png" alt="AntiDUB Logo" class="logo">
            <div class="title-group">
                <h1>AntiDUB</h1>
                <span class="version">v1.0.0</span>
            </div>
        </header>

        <main class="content">
            <div class="toggle-row">
                <span class="toggle-label" id="status-title">Bloquear Dublagem IA</span>
                <label class="switch" for="toggle-enabled">
                    <input type="checkbox" id="toggle-enabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <p class="status-description" id="status-desc">
                Forçando áudio original nos vídeos do YouTube.
            </p>
        </main>

        <footer class="footer">
            <span>Sempre o áudio original</span>
        </footer>
    </div>

    <script src="PopupController.js"></script>
</body>
</html>
